<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
		<title>guild home</title>
		<link rel="stylesheet" href="auth_chat.css">
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	height: 100dvh;
	overflow: hidden;
	overscroll-behavior: none;
	/* Keep the document pinned so the soft keyboard resizes instead of panning. */
	position: fixed;
	inset: 0;
	color: white;
	background-color: #0b0c10;
}

#game {
	position: fixed;
	left: 0;
	top: 0;
	overflow: hidden;
	background: #000;
	z-index: 1;
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#chat {
	position: fixed;
	z-index: 2;
	box-sizing: border-box;
	background: #111318;
	border-left: 1px solid #2a2e38;
	border-top: 1px solid #2a2e38;
	overflow: hidden;
	touch-action: auto;
	-webkit-overflow-scrolling: touch;
}

#chat.chat--right {
	border-top: none;
}

#chat.chat--bottom {
	border-left: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="game">
			<canvas id="canvas">
				Your browser does not support the canvas tag.
			</canvas>
			<div id="status">
				<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
				<progress id="status-progress"></progress>
				<div id="status-notice"></div>
			</div>
		</div>

		<div id="chat" aria-label="Chat and auth panel">
			<div id="chat-panel">
				<!-- Unauthenticated -->
				<section class="ac-view is-active" data-view="unauth">
					<div class="ac-center">
						<h2 style="margin:0;font-size:1.05rem;color:#e8ecf4;">길드 홈 채팅</h2>
						<p class="ac-muted">로그인하고 다른 모험가와 대화하세요.</p>
						<div class="ac-btn-row">
							<button type="button" class="ac-btn ac-btn--google" id="ac-btn-google" disabled>Google 로그인</button>
							<button type="button" class="ac-btn ac-btn--discord" id="ac-btn-discord" disabled>Discord 로그인</button>
						</div>
						<div class="ac-btn-row" style="margin-top:0.5rem">
							<button type="button" class="ac-btn ac-btn--mock" id="ac-btn-mock-google">Mock Google</button>
							<button type="button" class="ac-btn ac-btn--mock" id="ac-btn-mock-discord">Mock Discord</button>
						</div>
						<p class="ac-tip">자격 증명이 없으면 Mock으로 UI를 확인할 수 있습니다. 실제 연동은 config.js에 Client ID를 넣으세요.</p>
					</div>
				</section>

				<!-- First-time profile setup -->
				<section class="ac-view" data-view="profile_setup">
					<div class="ac-center">
						<div class="ac-setup-card">
							<img class="ac-avatar-preview" id="ac-setup-avatar" alt="avatar preview">
							<label for="ac-setup-nick">닉네임</label>
							<input type="text" id="ac-setup-nick" maxlength="32" autocomplete="nickname">
							<div class="ac-btn-row">
								<button type="button" class="ac-btn" id="ac-setup-save">저장하고 시작</button>
								<button type="button" class="ac-btn ac-btn--ghost" id="ac-setup-cancel">취소</button>
							</div>
						</div>
					</div>
				</section>

				<!-- Google / custom WebSocket chat -->
				<section class="ac-view" data-view="google_chat">
					<header class="ac-header">
						<div>
							<span class="ac-status-dot" id="ac-ws-dot"></span>
							<span class="ac-muted">채팅</span>
						</div>
						<div class="ac-btn-row">
							<button type="button" class="ac-btn ac-btn--discord" id="ac-link-discord" style="padding:0.35rem 0.65rem;font-size:0.78rem">Discord 연동</button>
							<button type="button" class="ac-btn ac-btn--ghost" id="ac-logout-google">로그아웃</button>
						</div>
					</header>
					<div class="ac-messages" id="ac-messages"></div>
					<form class="ac-composer" id="ac-composer-form">
						<div class="ac-composer-profile">
							<img id="ac-composer-avatar" alt="">
							<span id="ac-composer-nick">Guest</span>
						</div>
						<input type="text" id="ac-composer-input" placeholder="메시지 입력…" maxlength="500" autocomplete="off">
						<button type="submit" class="ac-btn">전송</button>
					</form>
				</section>

				<!-- Discord WidgetBot -->
				<section class="ac-view" data-view="discord_widget">
					<header class="ac-header">
						<h2>Discord</h2>
						<button type="button" class="ac-btn ac-btn--ghost" id="ac-logout-discord">로그아웃</button>
					</header>
					<div class="ac-widget-wrap" id="ac-widget-wrap" style="display:none"></div>
					<div class="ac-widget-fallback" id="ac-widget-fallback">
						WidgetBot 서버/채널 ID가 없습니다.<br>
						<small>config.js의 WIDGETBOT_SERVER_ID / WIDGETBOT_CHANNEL_ID를 설정하세요.</small>
					</div>
				</section>
			</div>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<!-- Public defaults ship with the build. Optional local config.js overrides them
		     and is never required in the deploy repo (404 is ignored). -->
		<script src="config.example.js"></script>
		<script>
		window.__guildConfigReady = fetch('config.js', { cache: 'no-store' })
			.then(function (res) {
				if (!res.ok) return null;
				return res.text();
			})
			.then(function (code) {
				if (!code) return;
				var el = document.createElement('script');
				el.text = code;
				document.head.appendChild(el);
			})
			.catch(function () { /* optional */ });
		</script>
		<script src="auth_chat.js"></script>
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		<script src="index.js"></script>
		<script>
const MIN_PANEL = 320;
const MIN_GAME = 240;
/** When the soft keyboard is open, keep the composer usable even if the game shrinks. */
const MIN_PANEL_KEYBOARD = 148;
const MIN_GAME_KEYBOARD = 120;
const MAX_BACKBUFFER = 1440;
/** Viewport must shrink by at least this much vs the resting size to count as a soft keyboard. */
const KEYBOARD_GAP_PX = 120;

const gameEl = document.getElementById('game');
const canvas = document.getElementById('canvas');
const chatEl = document.getElementById('chat');

/** Largest known "keyboard closed" height; used when Android resizes the layout viewport itself. */
let restingHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);

function applyBox(el, left, top, width, height) {
	el.style.left = left + 'px';
	el.style.top = top + 'px';
	el.style.width = width + 'px';
	el.style.height = height + 'px';
}

function viewportBox() {
	const vv = window.visualViewport;
	if (vv) {
		return {
			w: Math.max(1, Math.round(vv.width)),
			h: Math.max(1, Math.round(vv.height)),
			ox: Math.round(vv.offsetLeft),
			oy: Math.round(vv.offsetTop),
		};
	}
	return {
		w: window.innerWidth,
		h: window.innerHeight,
		ox: 0,
		oy: 0,
	};
}

function isSoftKeyboardOpen(vh) {
	const layoutH = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
	const visibleH = Math.min(vh, layoutH || vh);
	if (layoutH - visibleH > KEYBOARD_GAP_PX) {
		return true;
	}
	if (restingHeight > 0 && restingHeight - visibleH > KEYBOARD_GAP_PX) {
		return true;
	}
	return false;
}

function noteRestingHeight(vh, keyboard) {
	if (keyboard) {
		return;
	}
	// Ignore transient focus without a real shrink; grow the baseline on rotate / desktop resize.
	restingHeight = Math.max(restingHeight, vh, window.innerHeight || 0);
}

function layout() {
	const box = viewportBox();
	const vw = box.w;
	const vh = box.h;
	const keyboard = isSoftKeyboardOpen(vh);
	noteRestingHeight(vh, keyboard);
	const minPanel = keyboard ? MIN_PANEL_KEYBOARD : MIN_PANEL;
	const minGame = keyboard ? MIN_GAME_KEYBOARD : MIN_GAME;
	let gameW;
	let gameH;
	let chatLeft;
	let chatTop;
	let chatW;
	let chatH;

	if (vw >= vh) {
		if (vw - vh >= minPanel) {
			gameW = gameH = vh;
			chatLeft = vh;
			chatTop = 0;
			chatW = vw - vh;
			chatH = vh;
		} else {
			chatW = Math.min(minPanel, Math.max(0, vw - minGame));
			gameW = vw - chatW;
			gameH = vh;
			chatLeft = gameW;
			chatTop = 0;
			chatH = vh;
		}
		chatEl.classList.add('chat--right');
		chatEl.classList.remove('chat--bottom');
	} else {
		if (vh - vw >= minPanel) {
			gameW = gameH = vw;
			chatLeft = 0;
			chatTop = vw;
			chatW = vw;
			chatH = vh - vw;
		} else {
			chatH = Math.min(minPanel, Math.max(0, vh - minGame));
			gameH = vh - chatH;
			gameW = vw;
			chatLeft = 0;
			chatTop = gameH;
			chatW = vw;
		}
		chatEl.classList.add('chat--bottom');
		chatEl.classList.remove('chat--right');
	}

	// Anchor to the visual viewport so a keyboard pan does not cover the game.
	applyBox(gameEl, box.ox, box.oy, gameW, gameH);
	applyBox(chatEl, box.ox + chatLeft, box.oy + chatTop, chatW, chatH);
	document.body.classList.toggle('keyboard-open', keyboard);

	if (window.scrollX || window.scrollY) {
		window.scrollTo(0, 0);
	}

	const dpr = window.devicePixelRatio || 1;
	let bw = Math.max(1, Math.round(gameW * dpr));
	let bh = Math.max(1, Math.round(gameH * dpr));
	const longest = Math.max(bw, bh);
	if (longest > MAX_BACKBUFFER) {
		const scale = MAX_BACKBUFFER / longest;
		bw = Math.max(1, Math.round(bw * scale));
		bh = Math.max(1, Math.round(bh * scale));
	}
	if (canvas.width !== bw || canvas.height !== bh) {
		canvas.width = bw;
		canvas.height = bh;
	}
}

let layoutRaf = 0;
function scheduleLayout() {
	if (layoutRaf) {
		return;
	}
	layoutRaf = requestAnimationFrame(function () {
		layoutRaf = 0;
		layout();
	});
}

layout();
window.addEventListener('resize', scheduleLayout);
window.addEventListener('orientationchange', function () {
	// Rotation changes the resting baseline; clear so we re-learn it.
	restingHeight = 0;
	scheduleLayout();
	setTimeout(scheduleLayout, 300);
});
window.addEventListener('focusin', scheduleLayout);
window.addEventListener('focusout', function () {
	setTimeout(scheduleLayout, 50);
	setTimeout(scheduleLayout, 300);
});
if (window.visualViewport) {
	window.visualViewport.addEventListener('resize', scheduleLayout);
	window.visualViewport.addEventListener('scroll', scheduleLayout);
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":51526596,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
GODOT_CONFIG['canvasResizePolicy'] = 0;
GODOT_CONFIG['canvas'] = canvas;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			layout();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
